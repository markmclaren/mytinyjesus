<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta
      name="description"
      content="A framework-free recreation of the MyTinyJesus Flash widget."
    />
    <title>My Tiny Jesus | Saviour 2.1</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="tiny-jesus-stage" aria-label="My Tiny Jesus">
      <section class="bright-field" aria-hidden="true"></section>
      <section class="reflective-floor" aria-hidden="true"></section>

      <div class="archive-mark" aria-label="My Tiny Jesus, Saviour 2.0">
        <span>mytinyjesus.com</span><i></i><span>saviour 2.0</span>
      </div>

      <button
        type="button"
        class="speech-bubble"
        aria-label="Show the next message"
      >
        <span class="speech-bubble__message"></span>
        <span class="speech-bubble__meta">
          <strong></strong><time></time>
        </span>
        <span class="speech-bubble__tail" aria-hidden="true"></span>
      </button>

      <div class="jesus-figure" aria-hidden="true">
        <img src="./images/jesus.png" alt="" draggable="false" />
      </div>
      <div class="jesus-reflection" aria-hidden="true">
        <img src="./images/jesus.png" alt="" draggable="false" />
      </div>

      <div class="floor-note">
        <span class="message-count">200</span> fictional messages · click a
        bubble for another
      </div>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
